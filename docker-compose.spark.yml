# Cum Spark gia lap nhieu node (docs/03 Tuan 1 TV3 #2, Tuan 2 TV3 #1): 1 master + 2 worker.
# Chay: docker compose -f docker-compose.spark.yml up -d
# Spark Master UI: http://localhost:8080  |  Submit job: spark://localhost:7077
# Dung: docker compose -f docker-compose.spark.yml down
#
# Dung image chinh thuc apache/spark: Bitnami da go bitnami/spark khoi Docker Hub
# (pull bao "manifest unknown"). Phien ban image phai trung voi pyspark tren may
# chay driver (hien tai pyspark 4.2.0, Java 17).

x-spark-image: &spark-image apache/spark:4.2.0-scala2.13-java17-python3-ubuntu

x-spark-worker: &spark-worker
  image: *spark-image
  command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
  environment:
    - SPARK_WORKER_MEMORY=2G
    - SPARK_WORKER_CORES=2
  volumes:
    - ./warehouse/output:/data/warehouse
  depends_on:
    - spark-master
  networks:
    - spark-net

services:
  spark-master:
    image: *spark-image
    container_name: nhom16-spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    networks:
      - spark-net

  spark-worker-1:
    <<: *spark-worker
    container_name: nhom16-spark-worker-1

  spark-worker-2:
    <<: *spark-worker
    container_name: nhom16-spark-worker-2

networks:
  spark-net:
    driver: bridge
