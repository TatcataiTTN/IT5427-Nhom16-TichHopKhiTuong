# Cum Spark gia lap nhieu node (docs/03 Tuan 1 TV3 #2, Tuan 2 TV3 #1): 1 master + 2 worker.
# Chay: docker compose -f docker-compose.spark.yml up -d
# Spark Master UI: http://localhost:8080  |  Submit job: spark://localhost:7077
# Dung: docker compose -f docker-compose.spark.yml down
# Luu y (phat hien 20/10/2026): Bitnami rut tag "bitnami/spark:3.5" khoi Docker Hub (chinh sach
# moi, cac tag thuong chuyen sang anh tra phi). Dang dung "bitnamilegacy/spark:4.0.0" (anh dong
# bang cuoi cung con mien phi) thay the.

services:
  spark-master:
    image: bitnamilegacy/spark:4.0.0
    container_name: nhom16-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    networks:
      - spark-net

  spark-worker-1:
    image: bitnamilegacy/spark:4.0.0
    container_name: nhom16-spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    networks:
      - spark-net

  spark-worker-2:
    image: bitnamilegacy/spark:4.0.0
    container_name: nhom16-spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge
