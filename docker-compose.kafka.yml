# Kafka broker don (KRaft mode, khong can Zookeeper) cho Replay Streaming Pipeline
# (docs/03 Tuan 1 TV3 #8, Tuan 2 TV1 #9 + TV3 #2).
# Chay: docker compose -f docker-compose.kafka.yml up -d
# Dung: docker compose -f docker-compose.kafka.yml down
# Luu y (phat hien 20/10/2026): tag "bitnami/kafka:3.7" bi rut khoi Docker Hub, dung
# "bitnamilegacy/kafka:4.0.0-debian-12-r10" (anh dong bang con mien phi) thay the.

services:
  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: nhom16-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
