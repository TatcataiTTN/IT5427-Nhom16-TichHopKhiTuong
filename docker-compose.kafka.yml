# Kafka broker don (KRaft mode, khong can Zookeeper) cho Replay Streaming Pipeline
# (docs/03 Tuan 1 TV3 #8, Tuan 2 TV1 #9 + TV3 #2).
# Chay: docker compose -f docker-compose.kafka.yml up -d
# Dung: docker compose -f docker-compose.kafka.yml down
#
# Dung image chinh thuc apache/kafka: Bitnami da go bitnami/kafka khoi Docker Hub
# (pull bao "manifest unknown"), nen khong dung duoc nua.

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: nhom16-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
